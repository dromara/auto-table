spring:
  datasource:
    url: jdbc:h2:mem:testdb;DB_CLOSE_DELAY=-1;MODE=MySQL
    driver-class-name: org.h2.Driver
    username: sa
    password:

mybatis-plus:
  global-config:
    db-config:
      table-prefix: "t_"
      logic-delete-field: deleted
      logic-delete-value: 1
      logic-not-delete-value: 0
  # 注意：不显式配置 map-underscore-to-camel-case，
  # 以验证 adapter 能从 SqlSessionFactory 获取 MP 内部默认值 true
